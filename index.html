            // Handlers
            const handleDetailChange = (e) => setEventDetails({ ...eventDetails, [e.target.name]: e.target.value });
            
            const toggleMenuItem = (category, item) => {
                const current = menuSelection[category];
                const isSelected = category === 'cocktails' || category === 'mocktails' 
                    ? current.some(i => i.name === item.name)
                    : current.includes(item);
                
                let updated;
                if (isSelected) {
                    updated = category === 'cocktails' || category === 'mocktails'
                        ? current.filter(i => i.name !== item.name)
                        : current.filter(i => i !== item);
                } else {
                    updated = [...current, item];
                }
                setMenuSelection({ ...menuSelection, [category]: updated });
            };

            const handleAddCustom = (category) => {
                const val = customInputs[category]?.trim();
                if (!val) return;

                // Check duplicates in DB or Custom
                const isObj = ['cocktails', 'mocktails'].includes(category);
                const existing = [...MESS_MENU_DB[category], ...customItems[category]];
                
                const exists = existing.some(i => {
                    const iName = typeof i === 'object' ? i.name : i;
                    return iName.toLowerCase() === val.toLowerCase();
                });

                if (exists) {
                    alert("Item already exists!");
                    return;
                }

                let newItem = val;
                if (isObj) {
                    newItem = { name: val, recipe: 'Custom Entry', glass: 'Standard', tips: 'Ask Chef' };
                }

                // Update Custom Items List
                setCustomItems(prev => ({
                    ...prev,
                    [category]: [...prev[category], newItem]
                }));

                // Auto-select it
                setMenuSelection(prev => ({
                    ...prev,
                    [category]: [...prev[category], newItem]
                }));

                // Clear input
                setCustomInputs(prev => ({ ...prev, [category]: '' }));
            };

            const downloadImage = async () => {
                if (!previewRef.current) return;
                try {
                    const canvas = await html2canvas(previewRef.current, { scale: 2, useCORS: true });
                    const link = document.createElement('a');
                    link.download = `Menu-${eventDetails.type.replace(/\s+/g, '_')}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                } catch (err) {
                    alert("Error generating image. Please try again.");
                }

                 if (!previewRef.current) return;
                 try {
                     const canvas = await html2canvas(previewRef.current, { scale: 2, useCORS: true });
                     canvas.toBlob(async (blob) => {
                        const file = new File([blob], "menu.png", { type: "image/png" });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                files: [file],
                                title: 'Mess Menu',
                                text: `Menu for ${eventDetails.type}`
                            });
                        } else {
                            alert("Sharing not supported on this browser/device. Please download instead.");
                        }
                     });
                 } catch (err) {
                     console.error(err);
                 }
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* --- LEFT SIDEBAR / CONTROLS --- */}
                    <div className="w-full md:w-1/3 lg:w-1/4 bg-slate-800 text-white flex flex-col h-screen sticky top-0 overflow-hidden shadow-2xl z-10">
                        <div className="p-4 bg-slate-900 border-b border-slate-700 flex items-center justify-between">
                            <h1 className="text-xl font-bold flex items-center gap-2"><ChefHat className="text-yellow-500"/> Menu Designer</h1>
                            <span className="text-xs bg-yellow-600 px-2 py-1 rounded">122 Bn</span>
                        </div>
                        
                        {/* Navigation Steps */}
                        <div className="flex bg-slate-700">
                            <button onClick={() => setStep(1)} className={`flex-1 p-3 text-center text-sm ${step === 1 ? 'bg-yellow-600 font-bold' : 'hover:bg-slate-600'}`}>1. Details</button>
                            <button onClick={() => setStep(2)} className={`flex-1 p-3 text-center text-sm ${step === 2 ? 'bg-yellow-600 font-bold' : 'hover:bg-slate-600'}`}>2. Food</button>
                            <button onClick={() => setStep(3)} className={`flex-1 p-3 text-center text-sm ${step === 3 ? 'bg-yellow-600 font-bold' : 'hover:bg-slate-600'}`}>3. Design</button>
                        </div>

                        {/* Scrollable Content Area */}
                        <div className="flex-1 overflow-y-auto p-4 space-y-6">
                            
                            {/* STEP 1: EVENT DETAILS */}
                            {step === 1 && (
                                <div className="space-y-4 animate-fade-in">
                                    <h2 className="text-lg font-semibold text-yellow-400 border-b border-slate-600 pb-2">Event Basics</h2>
                                    <div>
                                        <label className="text-xs text-slate-400">Function Type</label>
                                        <select name="type" value={eventDetails.type} onChange={handleDetailChange} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm mt-1 focus:border-yellow-500 outline-none">
                                            <option>Bada Khana</option>
                                            <option>Regimental Dinner</option>
                                            <option>Anniversary Dinner</option>
                                            <option>At Home</option>
                                            <option>Senior Officer Visit Lunch</option>
                                            <option>Raising Day</option>
                                            <option>Mess Night</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400">Date</label>
                                        <input type="date" name="date" value={eventDetails.date} onChange={handleDetailChange} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm mt-1" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs text-slate-400">Time</label>
                                            <input type="text" name="time" value={eventDetails.time} onChange={handleDetailChange} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm mt-1" />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400">Venue</label>
                                            <input type="text" name="venue" value={eventDetails.venue} onChange={handleDetailChange} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm mt-1" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400">Dress Code</label>
                                        <select name="dressCode" value={eventDetails.dressCode} onChange={handleDetailChange} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm mt-1">
                                            <option>Lounge Suit / Saree</option>
                                            <option>Formals / Saree / Salwar Kameez</option>
                                            <option>6A / 6B</option>
                                            <option>Civvies</option>
                                            <option>Combats</option>
                                            <option>Black Tie</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400">Host/Organiser</label>
                                        <input type="text" name="host" value={eventDetails.host} onChange={handleDetailChange} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm mt-1" />
                                    </div>
                                     <div>
                                        <label className="text-xs text-slate-400">Invitee</label>
                                        <select name="inviteeType" value={eventDetails.inviteeType} onChange={handleDetailChange} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm mt-1">
                                            <option>With Lady</option>
                                            <option>Stag</option>
                                            <option>Family</option>
                                        </select>
                                    </div>
                                    <button onClick={() => setStep(2)} className="w-full bg-yellow-600 hover:bg-yellow-500 text-white py-2 rounded font-semibold mt-4">Next: Select Food</button>
                                </div>
                            )}

                            {/* STEP 2: MENU SELECTION */}
                            {step === 2 && (
                                <div className="space-y-4 animate-fade-in">
                                    <h2 className="text-lg font-semibold text-yellow-400 border-b border-slate-600 pb-2">Menu Items</h2>
                                    <p className="text-xs text-slate-400">Expand categories to select items.</p>
                                    
                                    {Object.entries(MESS_MENU_DB).map(([key, dbItems]) => {
                                        // Combine DB items and Custom Items
                                        const allItems = [...dbItems, ...customItems[key]];

                                        return (
                                        <details key={key} className="group bg-slate-900 rounded border border-slate-700">
                                            <summary className="flex cursor-pointer items-center justify-between p-3 font-medium text-slate-200 hover:bg-slate-800">
                                                <span className="capitalize">{key.replace('_', ' ')}</span>
                                                <span className="text-xs bg-slate-700 px-2 py-0.5 rounded-full">{menuSelection[key].length}</span>
                                            </summary>
                                            <div className="p-3 border-t border-slate-700">
                                                <div className="max-h-60 overflow-y-auto mb-2">
                                                    {allItems.map((item, idx) => {
                                                        const itemName = typeof item === 'object' ? item.name : item;
                                                        const isSelected = typeof item === 'object' 
                                                            ? menuSelection[key].some(i => i.name === itemName)
                                                            : menuSelection[key].includes(item);
                                                        
                                                        return (
                                                            <div key={idx} className="flex items-center space-x-2 py-1 hover:bg-slate-800 rounded px-1">
                                                                <input 
                                                                    type="checkbox" 
                                                                    checked={isSelected}
                                                                    onChange={() => toggleMenuItem(key, item)}
                                                                    className="rounded text-yellow-600 focus:ring-yellow-500 bg-slate-700 border-slate-500"
                                                                />
                                                                <span className="text-sm text-slate-300 flex-1">{itemName}</span>
                                                                {typeof item === 'object' && (
                                                                    <button onClick={(e) => {e.preventDefault(); setRecipeItem(item);}} className="text-yellow-500 hover:text-white">
                                                                        <Info size={14} />
                                                                    </button>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                
                                                {/* CUSTOM ADD FIELD */}
                                                <div className="mt-2 flex gap-2 pt-2 border-t border-slate-700">
                                                    <input 
                                                        type="text" 
                                                        value={customInputs[key] || ''}
                                                        onChange={(e) => setCustomInputs({...customInputs, [key]: e.target.value})}
                                                        placeholder="Add custom item..."
                                                        className="flex-1 bg-slate-800 border border-slate-600 rounded p-2 text-xs text-white placeholder-slate-500 focus:border-yellow-500 outline-none"
                                                        onKeyDown={(e) => e.key === 'Enter' && handleAddCustom(key)}
                                                    />
                                                    <button 
                                                        onClick={() => handleAddCustom(key)}
                                                        className="bg-yellow-600 text-white px-3 rounded hover:bg-yellow-500 transition-colors"
                                                        title="Add Custom Item"
                                                    >
                                                        <Plus size={16} />
                                                    </button>
                                                </div>
                                            </div>
                                        </details>
                                    );
                                    })}
                                    <button onClick={() => setStep(3)} className="w-full bg-yellow-600 hover:bg-yellow-500 text-white py-2 rounded font-semibold mt-4">Next: Design</button>
                                </div>
                            )}

                            {/* STEP 3: DESIGN */}
                            {step === 3 && (
                                <div className="space-y-4 animate-fade-in">
                                    <h2 className="text-lg font-semibold text-yellow-400 border-b border-slate-600 pb-2">Design Studio</h2>
                                    
                                    <div>
                                        <label className="text-xs text-slate-400">Visual Theme</label>
                                        <div className="grid grid-cols-2 gap-2 mt-1">
                                            {THEMES.map(t => (
                                                <button 
                                                    key={t.id}
                                                    onClick={() => setDesign({...design, theme: t})}
                                                    className={`p-2 text-xs rounded border ${design.theme.id === t.id ? 'border-yellow-500 bg-yellow-900/30' : 'border-slate-600 hover:bg-slate-800'}`}
                                                >
                                                    {t.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400">Header Font</label>
                                        <select 
                                            value={JSON.stringify(design.fontTitle)} 
                                            onChange={(e) => setDesign({...design, fontTitle: JSON.parse(e.target.value)})}
                                            className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm mt-1"
                                        >
                                            {FONTS.map((f, i) => <option key={i} value={JSON.stringify(f)}>{f.name}</option>)}
                                        </select>
                                    </div>
                                    
                                    <div className="flex items-center justify-between py-2 border-t border-slate-700">
                                        <span className="text-sm">Teetotaller Mode</span>
                                        <button 
                                            onClick={() => setDesign({...design, teetotallerMode: !design.teetotallerMode})}
                                            className={`w-10 h-5 rounded-full relative ${design.teetotallerMode ? 'bg-green-600' : 'bg-slate-600'}`}
                                        >
                                            <div className={`absolute w-3 h-3 bg-white rounded-full top-1 transition-all ${design.teetotallerMode ? 'left-6' : 'left-1'}`}></div>
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-between py-2 border-t border-slate-700">
                                        <span className="text-sm">Show Logo</span>
                                        <input type="checkbox" checked={design.showLogo} onChange={() => setDesign({...design, showLogo: !design.showLogo})} className="rounded text-yellow-600"/>
                                    </div>
                                    
                                    {design.showLogo && (
                                        <div>
                                             <label className="text-xs text-slate-400">Logo URL</label>
                                             <input 
                                                type="text" 
                                                value={design.logoUrl} 
                                                onChange={(e) => setDesign({...design, logoUrl: e.target.value})}
                                                className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-xs mt-1"
                                                placeholder="https://..."
                                             />
                                        </div>
                                    )}

                                    <div className="pt-4 flex gap-2">
                                        <button onClick={downloadImage} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded flex items-center justify-center gap-2">
                                            <Download size={16}/> Save IMG
                                        </button>
                                        <button onClick={shareMenu} className="flex-1 bg-green-600 hover:bg-green-500 text-white py-2 rounded flex items-center justify-center gap-2">
                                            <Share2 size={16}/> Share
                                        </button>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>

                    {/* --- RIGHT PREVIEW AREA --- */}
                    <div className="flex-1 bg-gray-200 overflow-auto p-4 md:p-8 flex justify-center items-start">
                        
                        {/* THE RENDERED CARD */}
                        <div 
                            ref={previewRef}
                            id="menu-preview"
                            className={`
                                w-full max-w-[210mm] min-h-[297mm] shadow-2xl relative transition-all duration-300
                                ${design.theme.bg} ${design.theme.text} ${design.theme.border}
                                flex flex-col
                            `}
                        >
                            {/* Header */}
                            <div className="p-8 pb-4 text-center">
                                {design.showLogo && (
                                    <img src={design.logoUrl} alt="Logo" className="h-20 mx-auto mb-4 object-contain drop-shadow-md" onError={(e) => e.target.style.display='none'} />
                                )}
                                <h2 className="text-sm uppercase tracking-widest opacity-80 mb-2">122 Bn Officers' Mess</h2>
                                <h1 className={`${design.fontTitle.class} text-5xl md:text-6xl mb-2 font-bold`}>
                                    {eventDetails.type}
                                </h1>
                                <div className="flex justify-center items-center gap-4 text-sm md:text-base mt-4 font-serif opacity-90 border-t border-b border-current py-2 mx-auto max-w-lg">
                                    <span>{new Date(eventDetails.date).toDateString()}</span>
                                    <span>•</span>
                                    <span>{eventDetails.time}</span>
                                    <span>•</span>
                                    <span>{eventDetails.venue}</span>
                                </div>
                                <div className="mt-2 text-xs md:text-sm italic">
                                    Dress: {eventDetails.dressCode}
                                </div>
                            </div>

                            {/* Menu Content */}
                            <div className="flex-1 p-8 pt-2 grid grid-cols-1 md:grid-cols-2 gap-8 content-start">
                                
                                {/* DRINKS SECTION (Left Column usually, or top) */}
                                {!design.teetotallerMode && (menuSelection.cocktails.length > 0 || menuSelection.mocktails.length > 0 || menuSelection.spirits.length > 0) && (
                                    <div className="col-span-1 md:col-span-2 text-center mb-6">
                                        <h3 className={`${design.fontTitle.class} text-3xl mb-4 border-b border-current inline-block px-8`}>From the Bar</h3>
                                        <div className="flex flex-wrap justify-center gap-x-8 gap-y-2 text-lg">
                                            {menuSelection.cocktails.map((c, i) => <span key={`cocktail-${i}`} className="font-semibold">{c.name}</span>)}
                                            {menuSelection.mocktails.map((m, i) => <span key={`mocktail-${i}`} className="font-semibold text-green-700">{m.name}</span>)}
                                            {menuSelection.spirits.map((s, i) => <span key={`spirit-${i}`} className="opacity-90">{s}</span>)}
                                        </div>
                                    </div>
                                )}

                                {/* STARTERS */}
                                {(menuSelection.starters_veg.length > 0 || menuSelection.starters_nonveg.length > 0) && (
                                    <div className="col-span-1 md:col-span-2 text-center mb-4">
                                        <h3 className={`${design.fontTitle.class} text-3xl mb-4 border-b border-current inline-block px-8`}>Appetizers</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 text-center">
                                            {menuSelection.starters_veg.length > 0 && (
                                                <div>
                                                    <h4 className="font-bold uppercase tracking-wider text-sm mb-2 opacity-70">Vegetarian</h4>
                                                    <ul className="space-y-1">
                                                        {menuSelection.starters_veg.map((item, i) => <li key={i}>{item}</li>)}
                                                    </ul>
                                                </div>
                                            )}
                                            {menuSelection.starters_nonveg.length > 0 && (
                                                <div>
                                                    <h4 className="font-bold uppercase tracking-wider text-sm mb-2 opacity-70">Non-Vegetarian</h4>
                                                    <ul className="space-y-1">
                                                        {menuSelection.starters_nonveg.map((item, i) => <li key={i}>{item}</li>)}
                                                    </ul>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* SOUPS & SALADS */}
                                {(menuSelection.soups.length > 0 || menuSelection.salads.length > 0) && (
                                    <div className="col-span-1 text-center">
                                         <h3 className={`${design.fontTitle.class} text-2xl mb-3 border-b border-current inline-block px-4`}>Soup & Salad</h3>
                                         <ul className="space-y-1">
                                             {menuSelection.soups.map((item, i) => <li key={`s-${i}`}>{item}</li>)}
                                             {menuSelection.salads.map((item, i) => <li key={`sl-${i}`}>{item}</li>)}
                                         </ul>
                                    </div>
                                )}

                                {/* BREADS & RICE */}
                                {(menuSelection.breads.length > 0 || menuSelection.rice.length > 0) && (
                                    <div className="col-span-1 text-center">
                                         <h3 className={`${design.fontTitle.class} text-2xl mb-3 border-b border-current inline-block px-4`}>Accompaniments</h3>
                                         <ul className="space-y-1">
                                             {menuSelection.breads.map((item, i) => <li key={`b-${i}`}>{item}</li>)}
                                             {menuSelection.rice.map((item, i) => <li key={`r-${i}`}>{item}</li>)}
                                         </ul>
                                    </div>
                                )}

                                {/* MAIN COURSE */}
                                {(menuSelection.main_veg.length > 0 || menuSelection.main_nonveg.length > 0) && (
                                    <div className="col-span-1 md:col-span-2 text-center mt-4">
                                        <h3 className={`${design.fontTitle.class} text-3xl mb-4 border-b border-current inline-block px-8`}>Main Course</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 text-center">
                                            {menuSelection.main_veg.length > 0 && (
                                                <div>
                                                    <h4 className="font-bold uppercase tracking-wider text-sm mb-2 opacity-70">Vegetarian</h4>
                                                    <ul className="space-y-1">
                                                        {menuSelection.main_veg.map((item, i) => <li key={i}>{item}</li>)}
                                                    </ul>
                                                </div>
                                            )}
                                            {menuSelection.main_nonveg.length > 0 && (
                                                <div>
                                                    <h4 className="font-bold uppercase tracking-wider text-sm mb-2 opacity-70">Non-Vegetarian</h4>
                                                    <ul className="space-y-1">
                                                        {menuSelection.main_nonveg.map((item, i) => <li key={i}>{item}</li>)}
                                                    </ul>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* DESSERTS */}
                                {menuSelection.desserts.length > 0 && (
                                    <div className="col-span-1 md:col-span-2 text-center mt-6">
                                        <h3 className={`${design.fontTitle.class} text-3xl mb-4 border-b border-current inline-block px-8`}>Dessert</h3>
                                        <ul className="flex flex-wrap justify-center gap-x-6 gap-y-2 text-lg">
                                            {menuSelection.desserts.map((item, i) => <li key={i}>{item}</li>)}
                                        </ul>
                                    </div>
                                )}
                            </div>

                            {/* Footer */}
                            <div className="p-8 pt-0 text-center opacity-70 text-sm mt-auto">
                                <p>Hosted by: {eventDetails.host}</p>
                                <p className="text-xs mt-1">RSVP Requested</p>
                            </div>
                        </div>

                    </div>

                    <RecipeModal isOpen={!!recipeItem} onClose={() => setRecipeItem(null)} item={recipeItem} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
